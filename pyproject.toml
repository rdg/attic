[project]
name = "attic"
version = "0.1.0"
description = "Extract and browse the attachments in a Maildir mail archive"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Georg Duemlein" }]
keywords = ["maildir", "email", "attachments", "archive", "deduplication"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
  "Topic :: System :: Archiving",
]
# Pillow is the only runtime dependency, and only for thumbnails and for
# rendering formats browsers cannot decode. Without it the tool still runs.
dependencies = ["pillow>=10.0"]

[project.urls]
# No Issues entry: the repo has issues, projects and the wiki turned off, so
# advertising a tracker that redirects to the repo root would be a dead link.
Homepage = "https://github.com/rdg/attic"
Source = "https://github.com/rdg/attic"

[project.scripts]
attic = "attic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attic"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  # The magic-number and CSS tables read better aligned than reflowed.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately build malformed input and poke at private helpers.
"tests/*" = ["E501", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=attic --cov-report=term-missing"

[tool.coverage.run]
source = ["src/attic"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
